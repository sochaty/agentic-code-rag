<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Single-pass RAG vs the agent, release by release">
