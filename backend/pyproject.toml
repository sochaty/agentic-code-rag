[project]
name = "agentic-code-rag"
version = "0.0.1"
description = "Ask questions about a codebase and get answers you can check."
license = "MIT"
authors = [{ name = "Sourish Chakraborty" }]
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.15.0",
  "fastembed>=0.9.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "qdrant-client>=1.19.1",
  "rank-bm25>=0.2.2",
  # 0.26.0 segfaults reading Node.start_point/end_point (Windows, CPython 3.13). Re-test before lifting.
  "tree-sitter>=0.25.2,<0.26",
  "tree-sitter-python>=0.25.0",
  "typer>=0.15",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "poethepoet>=0.31",
]

[project.scripts]
acr = "agentic_rag.cli:app"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
markers = ["live: hits the real Anthropic API (spends credit; never run in CI)"]
addopts = "-m 'not live'"

[tool.poe.tasks]
lint = "ruff check src tests"
fmt = "ruff format src tests"
fmt-check = "ruff format --check src tests"
typecheck = "mypy"
test = "pytest"
check = ["lint", "fmt-check", "typecheck", "test"]
